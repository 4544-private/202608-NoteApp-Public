<style>
  /* Custom daisyUI theme: warm paper + ink, evokes a physical notebook/receipt log */
  [data-theme="notebook"] {
    color-scheme: light;
    --p: 44.13% 0.0556 173.19;   --pc: 96.43% 0.0070 88.64;   /* primary: deep ink-stamp teal */
    --s: 45.93% 0.1134 31.09;    --sc: 96.43% 0.0070 88.64;   /* secondary: stamp red */
    --a: 66.41% 0.0831 77.40;    --ac: 22.22% 0.0175 74.66;   /* accent: aged brass */
    --n: 22.10% 0.0057 106.86;   --nc: 93.74% 0.0099 87.47;   /* neutral: ink */
    --b1: 93.74% 0.0099 87.47;  --b2: 90.40% 0.0141 88.69;  --b3: 86.75% 0.0172 88.01;  --bc: 22.10% 0.0057 106.86; /* paper base */
    --in: 53.83% 0.0952 257.76;  --inc: 96.43% 0.0070 88.64;
    --su: 52.95% 0.0813 158.60;  --suc: 96.43% 0.0070 88.64;
    --wa: 66.41% 0.0831 77.40;   --wac: 22.22% 0.0175 74.66;
    --er: 45.93% 0.1134 31.09;   --erc: 96.43% 0.0070 88.64;
    --rounded-box: 0.3rem;
    --rounded-btn: 0.25rem;
    --rounded-badge: 0.25rem;

  }
  ::selection { background: var(--b3); }
  .reset-btn { appearance: none; background: transparent; border: 0; padding: 0; margin: 0; }
  /* dvh shrinks automatically when the on-screen keyboard opens, unlike vh */
  .app-h { height: 100vh; height: 100dvh; }
</style>

<body class="app-h bg-base-100 text-base-content font-sans overflow-hidden">

<div class="drawer app-h">
  <input id="mainDrawer" type="checkbox" class="drawer-toggle">

  <div class="drawer-content app-h flex flex-col items-center">
    <div class="app-h w-full max-w-xl px-4 flex flex-col min-h-0">

      <div class="navbar bg-base-100 border-b border-base-300 px-0 shrink-0">
        <div class="navbar-start gap-1">
          <label for="mainDrawer" aria-label="メニューを開く" class="btn btn-ghost btn-square btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </label>
          <div id="navStart">
            <span class="font-mono text-sm font-semibold tracking-wide">
              <span class="text-primary">&gt;</span> memo
            </span>
          </div>
        </div>
      </div>

      <!-- ===== list screen ===== -->
  <div id="listScreen" style="display:none;" class="flex flex-col flex-1 min-h-0">
    <div class="shrink-0 bg-base-100 border-b border-base-300 py-4">
      <textarea id="newMemoInput" class="textarea textarea-bordered w-full font-mono text-sm leading-relaxed min-h-[76px]" placeholder="今、思ったことを。" autofocus></textarea>
      <div class="flex justify-end mt-2">
        <button id="newMemoBtn" class="btn btn-neutral btn-sm">記録する</button>
      </div>
      <div id="locationHint" class="text-[11px] font-mono text-base-content/40 mt-1"></div>
      <div id="listStatusBar" class="text-xs font-mono mt-1 hidden"></div>
    </div>

    <div id="threadList" class="flex-1 min-h-0 overflow-y-auto overscroll-contain">
      <div class="text-center py-16 text-sm font-mono text-base-content/40 leading-loose">まだメモがありません。</div>
    </div>
  </div>

  <!-- ===== detail screen ===== -->
  <div id="detailScreen" style="display:none;" class="flex flex-col flex-1 min-h-0">
    <div id="detailEntries" class="flex-1 min-h-0 overflow-y-auto overscroll-contain divide-y divide-base-300 py-1"></div>

    <div class="shrink-0 bg-base-100 border-t border-base-300 py-3">
      <textarea id="replyInput" class="textarea textarea-bordered w-full font-mono text-sm leading-relaxed min-h-[64px]" placeholder="この件について追記する…"></textarea>
      <div class="flex justify-between items-center mt-2">
        <button id="aiRequestBtn" class="btn btn-outline btn-sm font-mono">AIに依頼する</button>
        <button id="replyBtn" class="btn btn-neutral btn-sm">追記する</button>
      </div>
      <div id="detailStatusBar" class="text-xs font-mono mt-1 hidden"></div>
    </div>
  </div>

  <!-- ===== settings screen ===== -->
  <div id="settingsScreen" style="display:none;" class="max-w-md w-full mx-auto pt-10 flex-1 min-h-0 overflow-y-auto">
    <h2 class="font-mono text-base font-semibold mb-1">接続設定</h2>
    <p class="text-sm text-base-content/60 leading-relaxed mb-6">
      メモは GitHub の private リポジトリにファイルとしてコミットされます。
      Fine-grained Personal Access Token を、対象リポジトリ・Contents 権限(Read and write)のみに絞って発行してください。
      トークンはこのブラウザの localStorage にのみ保存されます。
    </p>
    <div class="form-control mb-4">
      <label class="label pb-1"><span class="label-text font-mono text-xs text-base-content/60">リポジトリ所有者(ユーザー名)</span></label>
      <input id="inputOwner" type="text" placeholder="例: yourname" autocomplete="off" class="input input-bordered font-mono text-sm">
    </div>
    <div class="form-control mb-4">
      <label class="label pb-1"><span class="label-text font-mono text-xs text-base-content/60">リポジトリ名</span></label>
      <input id="inputRepo" type="text" placeholder="例: my-memos" autocomplete="off" class="input input-bordered font-mono text-sm">
    </div>
    <div class="form-control mb-2">
      <label class="label pb-1"><span class="label-text font-mono text-xs text-base-content/60">Personal Access Token</span></label>
      <input id="inputPat" type="password" placeholder="github_pat_xxxxxxxx" autocomplete="off" class="input input-bordered font-mono text-sm">
      <label class="label pt-1"><span class="label-text-alt text-base-content/40 leading-relaxed">Fine-grained token / 対象リポジトリのみ / Contents: Read and write / Issues: Read and write(AI依頼機能を使う場合)</span></label>
    </div>
    <p class="text-xs text-base-content/40 leading-relaxed -mt-1 mb-2">「AIに依頼する」はGitHub Issueを作成するだけの機能です。自動連携は行わず、後でClaude CodeやCodexなどを手動で操作して、Open中のIssueを処理する運用を想定しています。</p>
    <div class="flex gap-2 mt-6">
      <button id="saveSettings" class="btn btn-neutral btn-sm">保存して接続</button>
      <button id="cancelSettings" style="display:none;" class="btn btn-ghost btn-sm">キャンセル</button>
    </div>
    <div id="settingsStatus" style="display:none;" class="text-xs font-mono mt-3"></div>
  </div>

    </div>
  </div>

  <div class="drawer-side z-20">
    <label for="mainDrawer" aria-label="メニューを閉じる" class="drawer-overlay"></label>
    <ul class="menu bg-base-200 text-base-content min-h-full w-60 p-3 gap-1">
      <li><button id="openSettings" class="font-mono text-sm justify-start">設定</button></li>
    </ul>
  </div>
</div>

<script>
(function () {
  const CONFIG_KEY = 'memoapp_config';
  const MEMO_DIR = 'memos';
  const STARS_PATH = 'meta/stars.json';

  let config = null;
  let memos = [];          // flat parsed memo objects
  let currentLocation = null;
  let currentThreadId = null; // set when detail screen is open
  let starsState = { sha: null, stars: {} }; // { [memoId]: true }

  // ---------- utils ----------
  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function base64ToUtf8(str) {
    return decodeURIComponent(escape(atob(str)));
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  function nowParts(d) {
    return {
      yyyy: d.getFullYear(),
      mm: pad(d.getMonth() + 1),
      dd: pad(d.getDate()),
      hh: pad(d.getHours()),
      mi: pad(d.getMinutes()),
      ss: pad(d.getSeconds())
    };
  }

  function localISOString(d) {
    const tzOffsetMin = -d.getTimezoneOffset();
    const sign = tzOffsetMin >= 0 ? '+' : '-';
    const abs = Math.abs(tzOffsetMin);
    const offH = pad(Math.floor(abs / 60));
    const offM = pad(abs % 60);
    const p = nowParts(d);
    return `${p.yyyy}-${p.mm}-${p.dd}T${p.hh}:${p.mi}:${p.ss}${sign}${offH}:${offM}`;
  }

  function randomHex(len) {
    const bytes = new Uint8Array(len);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('').slice(0, len);
  }

  function makeId(d) {
    const p = nowParts(d);
    return `${p.yyyy}${p.mm}${p.dd}-${p.hh}${p.mi}${p.ss}-${randomHex(4)}`;
  }

  function relativeTime(iso) {
    const d = new Date(iso);
    return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function firstLine(text) {
    return text.replace(/\s+/g, ' ').trim();
  }

  // ---------- star button (toggle-able any time, independent of memo file content) ----------
  function starIconSvg(filled) {
    return filled
      ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4"><path d="M12 2.5l2.9 6.26 6.85.86-5.05 4.77 1.36 6.86L12 17.9l-6.06 3.35 1.36-6.86L2.25 9.62l6.85-.86L12 2.5z"/></svg>`
      : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2.5l2.9 6.26 6.85.86-5.05 4.77 1.36 6.86L12 17.9l-6.06 3.35 1.36-6.86L2.25 9.62l6.85-.86L12 2.5z"/></svg>`;
  }

  function renderStarBtn(id) {
    const starred = isStarred(id);
    const colorClass = starred ? 'text-warning' : 'text-base-content/25 hover:text-base-content/50';
    return `<button class="reset-btn star-btn ${colorClass} transition-colors p-1" data-star-id="${escapeHtml(id)}" aria-label="スター">${starIconSvg(starred)}</button>`;
  }

  function wireStarButtons(container, onDone) {
    container.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.starId;
        btn.disabled = true;
        try {
          await toggleStar(id);
          onDone();
        } catch (err) {
          if (document.getElementById('listScreen').style.display !== 'none') {
            showStatus('listStatusBar', `スター更新失敗: ${err.message}`, 'err');
          } else {
            showStatus('detailStatusBar', `スター更新失敗: ${err.message}`, 'err');
          }
          btn.disabled = false;
        }
      });
    });
  }

  // ---------- config ----------
  function loadConfig() {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveConfig(c) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(c));
  }

  // ---------- local memo cache (keyed by repo, keyed by file path -> {sha, ...memo}) ----------
  function cacheKey() {
    return `memoapp_cache::${config.owner}::${config.repo}`;
  }
  function loadCache() {
    try {
      const raw = localStorage.getItem(cacheKey());
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveCache(cache) {
    try { localStorage.setItem(cacheKey(), JSON.stringify(cache)); } catch (e) { /* storage full: ignore, cache is best-effort */ }
  }
  function putCacheEntry(path, sha, memo) {
    const cache = loadCache();
    cache[path] = { sha, id: memo.id, thread_id: memo.thread_id, parent_id: memo.parent_id, created_at: memo.created_at, location: memo.location, body: memo.body };
    saveCache(cache);
  }

  // ---------- GitHub API ----------
  function ghHeaders() {
    return {
      'Authorization': `Bearer ${config.pat}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  async function ghFetch(url, opts = {}) {
    const res = await fetch(url, { ...opts, headers: { ...ghHeaders(), ...(opts.headers || {}) } });
    if (!res.ok) {
      let msg = `${res.status} ${res.statusText}`;
      try {
        const body = await res.json();
        if (body && body.message) msg += ` — ${body.message}`;
      } catch (e) {}
      throw new Error(msg);
    }
    return res.json();
  }

  async function getDefaultBranch() {
    const info = await ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}`);
    return info.default_branch;
  }

  async function fetchTree(branch) {
    const data = await ghFetch(
      `https://api.github.com/repos/${config.owner}/${config.repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`
    );
    return (data.tree || []).filter(
      item => item.type === 'blob' && item.path.startsWith(MEMO_DIR + '/') && item.path.endsWith('.md')
    );
  }

  async function fetchBlob(item) {
    const data = await ghFetch(item.url);
    return base64ToUtf8(data.content.replace(/\n/g, ''));
  }

  async function commitMemo(path, content, message) {
    return ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({
        message,
        content: utf8ToBase64(content),
        branch: config.branch
      })
    });
  }

  // ---------- AI kick (framework only, for now): create a plain GitHub Issue with the thread's
  //            content and no @-mention. Automatic triggering is on hold; the intended workflow is
  //            to periodically open Claude Code or Codex yourself and work through the open issues.
  //            Revisit AI_MENTION-based auto-triggering later if/when that becomes worth it. ----------
  function buildAiIssueTitle(thread, userText) {
    const base = userText ? userText.slice(0, 60) : firstLine(thread.entries[0].body).slice(0, 40);
    return `[${thread.tid}] ${base}`;
  }

  function buildAiIssueBody(thread, userText) {
    const entriesText = thread.entries.map(m =>
      `- [${m.created_at}] (memo id: ${m.id})\n  ${m.body.replace(/\n/g, '\n  ')}`
    ).join('\n\n');
    const instruction = userText || 'このメモを確認し、有用そうであれば整理・企画書化・簡単な試作など、適切だと思う形で対応してください。';
    return `${instruction}\n\n---\n\n以下がメモの内容です(スレッドID: ${thread.tid})。\n\n${entriesText}\n\n(各メモファイルは \`${MEMO_DIR}/\` 配下に \`<memo id>.md\` という名前で保存されています。必要であればリポジトリ内を検索してください。)`;
  }

  async function createAiIssue() {
    const thread = getThread(currentThreadId);
    if (!thread) throw new Error('スレッドが見つかりません');
    const userText = document.getElementById('replyInput').value.trim();
    return ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}/issues`, {
      method: 'POST',
      body: JSON.stringify({
        title: buildAiIssueTitle(thread, userText),
        body: buildAiIssueBody(thread, userText)
      })
    });
  }

  function showAiStatus(message, kind, linkUrl) {
    const el = document.getElementById('detailStatusBar');
    el.classList.remove('hidden');
    const colorClass = kind === 'err' ? 'text-error' : kind === 'ok' ? 'text-success' : 'text-base-content/50';
    el.className = `text-xs font-mono mt-1 ${colorClass}`;
    if (linkUrl) {
      el.innerHTML = `${escapeHtml(message)} <a href="${escapeHtml(linkUrl)}" target="_blank" rel="noopener" class="link">GitHubで見る →</a>`;
    } else {
      el.textContent = message;
    }
  }

  // ---------- stars.json (single mutable index file; memo files themselves stay write-once) ----------
  function sortObjectKeys(obj) {
    const out = {};
    Object.keys(obj).sort().forEach(k => { out[k] = obj[k]; });
    return out;
  }

  async function loadStars() {
    try {
      const data = await ghFetch(
        `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${STARS_PATH}?ref=${encodeURIComponent(config.branch)}`
      );
      const text = base64ToUtf8(data.content.replace(/\n/g, ''));
      starsState = { sha: data.sha, stars: JSON.parse(text) };
    } catch (e) {
      if (e.message.startsWith('404')) {
        starsState = { sha: null, stars: {} }; // file doesn't exist yet; created on first star
      } else {
        throw e;
      }
    }
  }

  function isStarred(id) {
    return !!starsState.stars[id];
  }

  async function writeStars(updatedStars) {
    const content = JSON.stringify(sortObjectKeys(updatedStars), null, 2) + '\n';
    const body = {
      message: 'update stars',
      content: utf8ToBase64(content),
      branch: config.branch
    };
    if (starsState.sha) body.sha = starsState.sha;
    const res = await ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${STARS_PATH}`, {
      method: 'PUT',
      body: JSON.stringify(body)
    });
    starsState = { sha: res.content.sha, stars: updatedStars };
  }

  async function toggleStar(id) {
    const updated = { ...starsState.stars };
    if (updated[id]) delete updated[id]; else updated[id] = true;
    try {
      await writeStars(updated);
    } catch (e) {
      // sha mismatch (another write landed first) — refresh once and retry the same toggle
      if (e.message.startsWith('409') || e.message.toLowerCase().includes('does not match')) {
        await loadStars();
        const retried = { ...starsState.stars };
        if (retried[id]) delete retried[id]; else retried[id] = true;
        await writeStars(retried);
      } else {
        throw e;
      }
    }
  }

  // ---------- frontmatter ----------
  function parseFrontmatter(text) {
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if (!m) return { meta: {}, body: text.trim() };
    const [, fm, body] = m;
    const meta = {};
    const lines = fm.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^\s/.test(line)) continue; // nested (location) handled below
      const km = line.match(/^([a-zA-Z_]+):\s*(.*)$/);
      if (!km) continue;
      const key = km[1];
      let val = km[2].trim();
      if (key === 'location') {
        const loc = {};
        let j = i + 1;
        while (j < lines.length && /^\s+/.test(lines[j])) {
          const lm = lines[j].match(/^\s+([a-zA-Z_]+):\s*(.*)$/);
          if (lm) loc[lm[1]] = lm[2].trim();
          j++;
        }
        meta.location = loc;
        continue;
      }
      if (val === 'null' || val === '') val = null;
      meta[key] = val;
    }
    return { meta, body: body.trim() };
  }

  function buildMarkdown(memo) {
    let fm = '---\n';
    fm += `id: ${memo.id}\n`;
    fm += `thread_id: ${memo.thread_id}\n`;
    fm += `parent_id: ${memo.parent_id ?? 'null'}\n`;
    fm += `created_at: ${memo.created_at}\n`;
    if (memo.location) {
      fm += `location:\n  lat: ${memo.location.lat}\n  lng: ${memo.location.lng}\n`;
      if (memo.location.address) fm += `  address: ${memo.location.address}\n`;
    }
    fm += `status: unprocessed\n`;
    fm += '---\n\n';
    return fm + memo.body + '\n';
  }

  // ---------- geolocation (best-effort, silent) ----------
  function shortenAddress(displayName) {
    if (!displayName) return null;
    return displayName.split(',').map(s => s.trim()).slice(0, 3).join(', ');
  }

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=0`);
      if (!res.ok) return null;
      const data = await res.json();
      return shortenAddress(data.display_name);
    } catch (e) {
      return null; // best-effort only; fall back to raw coordinates elsewhere
    }
  }

  function requestLocation() {
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const lat = pos.coords.latitude.toFixed(4);
        const lng = pos.coords.longitude.toFixed(4);
        currentLocation = { lat, lng };
        const hint = document.getElementById('locationHint');
        if (hint) hint.textContent = `位置情報を取得済み (${lat}, ${lng})`;
        const address = await reverseGeocode(lat, lng);
        if (address) {
          currentLocation.address = address;
          if (hint) hint.textContent = `位置情報を取得済み: ${address}`;
        }
      },
      () => { /* silently ignore denial/failure */ },
      { timeout: 5000 }
    );
  }

  // ---------- status bars ----------
  function showStatus(elId, msg, kind) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.textContent = msg;
    const colorClass = kind === 'err' ? 'text-error' : kind === 'ok' ? 'text-success' : 'text-base-content/50';
    el.className = `text-xs font-mono mt-1 ${colorClass}`;
    if (kind === 'ok') {
      setTimeout(() => { el.classList.add('hidden'); }, 2500);
    }
  }

  // ---------- thread grouping ----------
  function buildThreads() {
    const threadMap = new Map(); // thread_id -> [memos]
    for (const m of memos) {
      const tid = m.thread_id || m.id;
      if (!threadMap.has(tid)) threadMap.set(tid, []);
      threadMap.get(tid).push(m);
    }
    const threads = [];
    for (const [tid, list] of threadMap) {
      list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const latest = list[list.length - 1].created_at;
      threads.push({ tid, entries: list, latest });
    }
    threads.sort((a, b) => new Date(b.latest) - new Date(a.latest));
    return threads;
  }

  function getThread(tid) {
    return buildThreads().find(t => t.tid === tid);
  }

  // ---------- render: list screen ----------
  // ---------- shared layout: metadata row (time -> address -> right-aligned extras), then full-width body ----------
  function renderMemoBlock(m, { clamp = false, extraRight = '' } = {}) {
    const locText = m.location ? (m.location.address || `${m.location.lat}, ${m.location.lng}`) : '';
    return `
      <div class="flex items-center gap-2 text-[11px] font-mono text-base-content/40 w-full mb-1">
        <span class="flex-shrink-0">${relativeTime(m.created_at)}</span>
        ${locText ? `<span class="truncate min-w-0">${escapeHtml(locText)}</span>` : ''}
        <span class="flex-1"></span>
        <span class="flex items-center gap-1 flex-shrink-0">${extraRight}</span>
      </div>
      <p class="text-sm leading-relaxed whitespace-pre-wrap break-words w-full ${clamp ? 'line-clamp-3' : ''}">${escapeHtml(m.body)}</p>`;
  }

  function renderThreadList() {
    const container = document.getElementById('threadList');
    if (memos.length === 0) {
      container.innerHTML = '<div class="text-center py-16 text-sm font-mono text-base-content/40 leading-loose">まだメモがありません。<br>上の欄に書いて「記録する」を押してください。</div>';
      return;
    }
    const threads = buildThreads();
    container.innerHTML = threads.map(t => {
      const root = t.entries[0];
      const count = t.entries.length;
      const badge = count > 1
        ? `<span class="badge badge-primary badge-sm font-mono">${count}件</span>`
        : '';
      const extraRight = `${badge}${renderStarBtn(root.id)}`;
      return `
        <button class="reset-btn thread-row w-full text-left flex flex-col py-4 border-b border-base-300 hover:bg-base-200/60 transition-colors" data-tid="${escapeHtml(t.tid)}">
          ${renderMemoBlock(root, { clamp: true, extraRight })}
        </button>`;
    }).join('');

    container.querySelectorAll('.thread-row').forEach(row => {
      row.addEventListener('click', () => openThread(row.dataset.tid));
    });
    wireStarButtons(container, renderThreadList);
  }

  // ---------- render: detail screen ----------
  function renderDetail() {
    const thread = getThread(currentThreadId);
    if (!thread) { showList(); return; }
    document.getElementById('detailTitle').textContent = `${thread.entries.length}件 / 最初のメモ: ${relativeTime(thread.entries[0].created_at)}`;
    const container = document.getElementById('detailEntries');
    container.innerHTML = thread.entries.map(m => `
      <div class="flex flex-col py-3">
        ${renderMemoBlock(m, { clamp: false, extraRight: renderStarBtn(m.id) })}
      </div>`).join('');
    wireStarButtons(container, renderDetail);
  }

  // ---------- navbar-start: swaps between app title and back+thread-info ----------
  function setNavList() {
    document.getElementById('navStart').innerHTML = `
      <span class="font-mono text-sm font-semibold tracking-wide">
        <span class="text-primary">&gt;</span> memo
      </span>`;
  }

  function setNavDetail() {
    document.getElementById('navStart').innerHTML = `
      <button id="backBtn" class="btn btn-ghost btn-sm font-mono">← 一覧</button>
      <span id="detailTitle" class="text-[11px] font-mono text-base-content/40 ml-2"></span>`;
    document.getElementById('backBtn').addEventListener('click', showList);
  }

  // ---------- navigation ----------
  function showList() {
    currentThreadId = null;
    document.getElementById('detailScreen').style.display = 'none';
    document.getElementById('settingsScreen').style.display = 'none';
    document.getElementById('listScreen').style.display = 'flex';
    setNavList();
    renderThreadList();
  }

  function openThread(tid) {
    currentThreadId = tid;
    document.getElementById('listScreen').style.display = 'none';
    document.getElementById('settingsScreen').style.display = 'none';
    document.getElementById('detailScreen').style.display = 'flex';
    setNavDetail();
    document.getElementById('replyInput').value = '';
    renderDetail();
    document.getElementById('detailEntries').scrollTop = document.getElementById('detailEntries').scrollHeight;
  }

  // ---------- load from GitHub (tree-diff cached) ----------
  async function loadMemos() {
    showStatus('listStatusBar', '読み込み中…', 'ok');
    document.getElementById('listStatusBar').classList.remove('hidden');
    try {
      const branch = config.branch || await getDefaultBranch();
      config.branch = branch;
      saveConfig(config);

      const [items] = await Promise.all([
        fetchTree(branch),
        loadStars()
      ]);
      const cache = loadCache();
      let fetchedCount = 0;

      const results = await Promise.all(items.map(async item => {
        const cached = cache[item.path];
        if (cached && cached.sha === item.sha) {
          return cached;
        }
        const text = await fetchBlob(item);
        const { meta, body } = parseFrontmatter(text);
        const entry = { sha: item.sha, ...meta, body };
        cache[item.path] = entry;
        fetchedCount++;
        return entry;
      }));

      saveCache(cache);
      memos = results.filter(m => m.id && m.created_at);
      renderThreadList();
      showStatus('listStatusBar', `更新完了(新規取得 ${fetchedCount} 件 / 全 ${memos.length} 件)`, 'ok');
    } catch (e) {
      showStatus('listStatusBar', `読み込み失敗: ${e.message}`, 'err');
    }
  }

  // ---------- submit: new memo (from list screen) ----------
  async function submitNewMemo() {
    const textarea = document.getElementById('newMemoInput');
    const body = textarea.value.trim();
    if (!body) return;

    const now = new Date();
    const id = makeId(now);
    const memo = {
      id,
      thread_id: id,
      parent_id: null,
      created_at: localISOString(now),
      location: currentLocation,
      body
    };

    const btn = document.getElementById('newMemoBtn');
    btn.disabled = true;
    document.getElementById('listStatusBar').classList.remove('hidden');
    showStatus('listStatusBar', '記録中…', 'ok');
    try {
      await commitOne(memo);
      textarea.value = '';
      showStatus('listStatusBar', '記録しました', 'ok');
      renderThreadList();
    } catch (e) {
      showStatus('listStatusBar', `記録失敗: ${e.message}`, 'err');
    } finally {
      btn.disabled = false;
      textarea.focus();
    }
  }

  // ---------- submit: reply (from detail screen) ----------
  async function submitReply() {
    if (!currentThreadId) return;
    const textarea = document.getElementById('replyInput');
    const body = textarea.value.trim();
    if (!body) return;

    const thread = getThread(currentThreadId);
    const lastEntry = thread.entries[thread.entries.length - 1];

    const now = new Date();
    const id = makeId(now);
    const memo = {
      id,
      thread_id: currentThreadId,
      parent_id: lastEntry.id,
      created_at: localISOString(now),
      location: currentLocation,
      body
    };

    const btn = document.getElementById('replyBtn');
    btn.disabled = true;
    document.getElementById('detailStatusBar').classList.remove('hidden');
    showStatus('detailStatusBar', '記録中…', 'ok');
    try {
      await commitOne(memo);
      textarea.value = '';
      showStatus('detailStatusBar', '記録しました', 'ok');
      renderDetail();
      document.getElementById('detailEntries').scrollTop = document.getElementById('detailEntries').scrollHeight;
    } catch (e) {
      showStatus('detailStatusBar', `記録失敗: ${e.message}`, 'err');
    } finally {
      btn.disabled = false;
      textarea.focus();
    }
  }

  async function commitOne(memo) {
    const created = new Date(memo.created_at);
    const p = nowParts(created);
    const path = `${MEMO_DIR}/${p.yyyy}/${p.mm}/${p.dd}/${memo.id}.md`;
    const content = buildMarkdown(memo);
    const res = await commitMemo(path, content, `memo: ${memo.body.slice(0, 40).replace(/\n/g, ' ')}`);
    memos.push(memo);
    const sha = res && res.content && res.content.sha;
    if (sha) putCacheEntry(path, sha, memo);
  }

  // ---------- settings screen ----------
  function showSettings(isInitial) {
    document.getElementById('listScreen').style.display = 'none';
    document.getElementById('detailScreen').style.display = 'none';
    document.getElementById('settingsScreen').style.display = 'block';
    document.getElementById('cancelSettings').style.display = isInitial ? 'none' : 'inline-flex';
    setNavList();
    if (config) {
      document.getElementById('inputOwner').value = config.owner || '';
      document.getElementById('inputRepo').value = config.repo || '';
      document.getElementById('inputPat').value = config.pat || '';
    }
  }

  async function handleSaveSettings() {
    const owner = document.getElementById('inputOwner').value.trim();
    const repo = document.getElementById('inputRepo').value.trim();
    const pat = document.getElementById('inputPat').value.trim();
    const statusEl = document.getElementById('settingsStatus');
    if (!owner || !repo || !pat) {
      statusEl.textContent = 'すべて入力してください。';
      statusEl.style.display = 'block';
      statusEl.className = 'text-xs font-mono mt-3 text-error';
      return;
    }
    statusEl.textContent = '接続確認中…';
    statusEl.style.display = 'block';
    statusEl.className = 'text-xs font-mono mt-3 text-base-content/50';

    const testConfig = { owner, repo, pat, branch: null };
    config = testConfig;
    try {
      config.branch = await getDefaultBranch();
      saveConfig(config);
      showList();
      requestLocation();
      loadMemos();
    } catch (e) {
      statusEl.textContent = `接続失敗: ${e.message}`;
      statusEl.className = 'text-xs font-mono mt-3 text-error';
    }
  }

  // ---------- init ----------
  function init() {
    config = loadConfig();

    document.getElementById('openSettings').addEventListener('click', () => {
      document.getElementById('mainDrawer').checked = false;
      showSettings(false);
    });
    document.getElementById('cancelSettings').addEventListener('click', showList);
    document.getElementById('saveSettings').addEventListener('click', handleSaveSettings);

    document.getElementById('newMemoBtn').addEventListener('click', submitNewMemo);
    document.getElementById('newMemoInput').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitNewMemo();
    });

    document.getElementById('replyBtn').addEventListener('click', submitReply);
    document.getElementById('replyInput').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitReply();
    });
    document.getElementById('replyInput').addEventListener('focus', () => {
      // give the keyboard a moment to open / dvh to settle, then reveal the latest entry
      setTimeout(() => {
        const container = document.getElementById('detailEntries');
        container.scrollTop = container.scrollHeight;
      }, 150);
    });

    document.getElementById('aiRequestBtn').addEventListener('click', async () => {
      const btn = document.getElementById('aiRequestBtn');
      showAiStatus('AIへ依頼を送信中…', 'ok');
      btn.disabled = true;
      try {
        const res = await createAiIssue();
        document.getElementById('replyInput').value = '';
        showAiStatus(`依頼を送信しました(Issue #${res.number})`, 'ok', res.html_url);
      } catch (e) {
        showAiStatus(`送信失敗: ${e.message}`, 'err');
      } finally {
        btn.disabled = false;
      }
    });

    if (!config || !config.owner || !config.repo || !config.pat) {
      showSettings(true);
    } else {
      showList();
      requestLocation();
      loadMemos();
    }
  }

  init();
})();
</script>
