<!DOCTYPE html>
<html lang="ja" data-theme="notebook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>memo → git</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          sans: ['"IBM Plex Sans JP"', 'system-ui', 'sans-serif'],
        }
      }

  }
</script>
<style>
  /* Custom daisyUI theme: warm paper + ink, evokes a physical notebook/receipt log */
  [data-theme="notebook"] {
    color-scheme: light;
    --p: 44.13% 0.0556 173.19;   --pc: 96.43% 0.0070 88.64;   /* primary: deep ink-stamp teal */
    --s: 45.93% 0.1134 31.09;    --sc: 96.43% 0.0070 88.64;   /* secondary: stamp red */
    --a: 66.41% 0.0831 77.40;    --ac: 22.22% 0.0175 74.66;   /* accent: aged brass */
    --n: 22.10% 0.0057 106.86;   --nc: 93.74% 0.0099 87.47;   /* neutral: ink */
    --b1: 100.00% 0.0000 89.88;  --b2: 95.78% 0.0054 95.10;  --b3: 86.75% 0.0172 88.01;  --bc: 22.10% 0.0057 106.86; /* white base */
    --in: 53.83% 0.0952 257.76;  --inc: 96.43% 0.0070 88.64;
    --su: 52.95% 0.0813 158.60;  --suc: 96.43% 0.0070 88.64;
    --wa: 66.41% 0.0831 77.40;   --wac: 22.22% 0.0175 74.66;
    --er: 45.93% 0.1134 31.09;   --erc: 96.43% 0.0070 88.64;
    --rounded-box: 0.3rem;
    --rounded-btn: 0.25rem;
    --rounded-badge: 0.25rem;
    --tab-radius: 0.25rem;
  }
  ::selection { background: var(--b3); }
  .reset-btn { appearance: none; background: transparent; border: 0; padding: 0; margin: 0; }
  /* Badge-only color overrides — lighter/more vivid than the theme's info/warning/neutral,
     which stay unchanged everywhere else (buttons, borders, etc.) */
  .badge-info { background-color: #BFDBFE; border-color: #BFDBFE; color: #1E40AF; }
  .badge-warning { background-color: #FEF08A; border-color: #FEF08A; color: #854D0E; }
  .badge-neutral { background-color: #FECACA; border-color: #FECACA; color: #991B1B; }
  /* dvh shrinks automatically when the on-screen keyboard opens, unlike vh */
  .app-h { height: 100vh; height: 100dvh; }
</style>
</head>
<body class="app-h bg-base-100 text-base-content font-sans overflow-hidden">

<div class="drawer app-h">
  <input id="mainDrawer" type="checkbox" class="drawer-toggle">

  <div class="drawer-content app-h flex flex-col items-center">
    <div class="app-h w-full max-w-xl px-4 flex flex-col min-h-0">

      <div class="navbar bg-base-100 border-b border-base-300 px-0 shrink-0">
        <div class="navbar-start gap-1 min-w-0">
          <label for="mainDrawer" aria-label="メニューを開く" class="btn btn-ghost btn-square btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </label>
          <div id="navStart" class="flex items-center gap-1 min-w-0 flex-1">
            <span class="font-mono text-sm font-semibold tracking-wide">
              <span class="text-primary">&gt;</span> memo
            </span>
          </div>
        </div>
      </div>

      <!-- ===== list screen ===== -->
  <div id="listScreen" style="display:none;" class="flex flex-col flex-1 min-h-0">
    <div class="shrink-0 flex justify-end items-center gap-2 px-1 py-2 border-b border-base-300">
      <label class="label cursor-pointer gap-2 py-0">
        <span class="label-text text-[11px] font-mono text-base-content/50">各スレッド最新のみ</span>
        <input type="checkbox" id="latestOnlyToggle" class="toggle toggle-sm toggle-primary">
      </label>
    </div>
    <div id="threadList" class="flex-1 min-h-0 overflow-y-auto overscroll-contain">
      <div class="text-center py-16 text-sm font-mono text-base-content/40 leading-loose">まだメモがありません。</div>
    </div>

    <div class="shrink-0 bg-base-100 border-t border-base-300 py-4">
      <input id="newMemoTitleInput" type="text" class="input input-bordered w-full font-mono text-sm mb-2" placeholder="件名(省略可)">
      <textarea id="newMemoInput" class="textarea textarea-bordered w-full font-mono text-sm leading-relaxed min-h-[76px]" placeholder="今、思ったことを。"></textarea>
      <div id="newMemoTagPicker" class="flex flex-wrap gap-1 mt-2"></div>
      <div id="newMemoAttachments" class="flex flex-wrap gap-1 mt-2"></div>
      <div class="flex justify-between items-center mt-2">
        <div>
          <input type="file" id="newMemoFileInput" class="hidden" multiple accept=".pdf,.md,image/*">
          <button type="button" id="newMemoAttachBtn" class="btn btn-outline btn-sm" aria-label="ファイルを添付">📎</button>
        </div>
        <button id="newMemoBtn" class="btn btn-neutral btn-sm">記録する</button>
      </div>
      <div id="locationHint" class="text-[11px] font-mono text-base-content/40 mt-1"></div>
      <div id="listStatusBar" class="text-xs font-mono mt-1 hidden"></div>
    </div>
  </div>

  <!-- ===== detail screen ===== -->
  <div id="detailScreen" style="display:none;" class="flex flex-col flex-1 min-h-0">
    <div id="detailEntries" class="flex-1 min-h-0 overflow-y-auto overscroll-contain divide-y divide-base-300 py-1"></div>

    <div class="shrink-0 bg-base-100 border-t border-base-300 py-3">
      <textarea id="replyInput" class="textarea textarea-bordered w-full font-mono text-sm leading-relaxed min-h-[64px]" placeholder="この件について追記する…"></textarea>
      <div id="replyTagPicker" class="flex flex-wrap gap-1 mt-2"></div>
      <div id="replyAttachments" class="flex flex-wrap gap-1 mt-2"></div>
      <div class="flex justify-between items-center mt-2">
        <div class="flex items-center gap-2">
          <input type="file" id="replyFileInput" class="hidden" multiple accept=".pdf,.md,image/*">
          <button type="button" id="replyAttachBtn" class="btn btn-outline btn-sm" aria-label="ファイルを添付">📎</button>
          <button id="aiRequestBtn" class="btn btn-outline btn-sm font-mono">AIに依頼する</button>
        </div>
        <button id="replyBtn" class="btn btn-neutral btn-sm">追記する</button>
      </div>
      <div id="detailStatusBar" class="text-xs font-mono mt-1 hidden"></div>
    </div>
  </div>

  <!-- ===== settings screen ===== -->
  <div id="settingsScreen" style="display:none;" class="max-w-md w-full mx-auto pt-10 flex-1 min-h-0 overflow-y-auto">
    <h2 class="font-mono text-base font-semibold mb-1">接続設定</h2>
    <p class="text-sm text-base-content/60 leading-relaxed mb-6">
      メモは GitHub の private リポジトリにファイルとしてコミットされます。
      Fine-grained Personal Access Token を、対象リポジトリ・Contents 権限(Read and write)のみに絞って発行してください。
      トークンはこのブラウザの localStorage にのみ保存されます。
    </p>
    <div class="form-control mb-4">
      <label class="label pb-1"><span class="label-text font-mono text-xs text-base-content/60">リポジトリ所有者(ユーザー名)</span></label>
      <input id="inputOwner" type="text" placeholder="例: yourname" autocomplete="off" class="input input-bordered font-mono text-sm">
    </div>
    <div class="form-control mb-4">
      <label class="label pb-1"><span class="label-text font-mono text-xs text-base-content/60">リポジトリ名</span></label>
      <input id="inputRepo" type="text" placeholder="例: my-memos" autocomplete="off" class="input input-bordered font-mono text-sm">
    </div>
    <div class="form-control mb-2">
      <label class="label pb-1"><span class="label-text font-mono text-xs text-base-content/60">Personal Access Token</span></label>
      <input id="inputPat" type="password" placeholder="github_pat_xxxxxxxx" autocomplete="off" class="input input-bordered font-mono text-sm">
      <label class="label pt-1"><span class="label-text-alt text-base-content/40 leading-relaxed">Fine-grained token / 対象リポジトリのみ / Contents: Read and write / Issues: Read and write(AI依頼機能を使う場合)</span></label>
    </div>
    <p class="text-xs text-base-content/40 leading-relaxed -mt-1 mb-2">「AIに依頼する」はGitHub Issueを作成するだけの機能です。自動連携は行わず、後でClaude CodeやCodexなどを手動で操作して、Open中のIssueを処理する運用を想定しています。</p>
    <div class="flex gap-2 mt-6">
      <button id="saveSettings" class="btn btn-neutral btn-sm">保存して接続</button>
      <button id="cancelSettings" style="display:none;" class="btn btn-ghost btn-sm">キャンセル</button>
    </div>
    <div id="settingsStatus" style="display:none;" class="text-xs font-mono mt-3"></div>
  </div>

    </div>
  </div>

  <div class="drawer-side z-20">
    <label for="mainDrawer" aria-label="メニューを閉じる" class="drawer-overlay"></label>
    <ul class="menu bg-base-200 text-base-content min-h-full w-60 p-3 gap-1">
      <li><button id="openSettings" class="font-mono text-sm justify-start">設定</button></li>
    </ul>
  </div>
</div>

<script>
(function () {
  const CONFIG_KEY = 'memoapp_config';
  const MEMO_DIR = 'memos';
  const STARS_PATH = 'meta/stars.json';

  let config = null;
  let memos = [];          // flat parsed memo objects
  let currentLocation = null;
  let currentThreadId = null; // set when detail screen is open
  let listMode = localStorage.getItem('memoapp_listmode') || 'all'; // 'all' | 'latest'
  let starsState = { sha: null, stars: {} }; // { [memoId]: true }

  // ---------- utils ----------
  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function base64ToUtf8(str) {
    return decodeURIComponent(escape(atob(str)));
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  function nowParts(d) {
    return {
      yyyy: d.getFullYear(),
      mm: pad(d.getMonth() + 1),
      dd: pad(d.getDate()),
      hh: pad(d.getHours()),
      mi: pad(d.getMinutes()),
      ss: pad(d.getSeconds())
    };
  }

  function localISOString(d) {
    const tzOffsetMin = -d.getTimezoneOffset();
    const sign = tzOffsetMin >= 0 ? '+' : '-';
    const abs = Math.abs(tzOffsetMin);
    const offH = pad(Math.floor(abs / 60));
    const offM = pad(abs % 60);
    const p = nowParts(d);
    return `${p.yyyy}-${p.mm}-${p.dd}T${p.hh}:${p.mi}:${p.ss}${sign}${offH}:${offM}`;
  }

  function randomHex(len) {
    const bytes = new Uint8Array(len);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('').slice(0, len);
  }

  function makeId(d) {
    const p = nowParts(d);
    return `${p.yyyy}${p.mm}${p.dd}-${p.hh}${p.mi}${p.ss}-${randomHex(4)}`;
  }

  function relativeTime(iso) {
    const d = new Date(iso);
    return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function firstLine(text) {
    return text.replace(/\s+/g, ' ').trim();
  }

  // ---------- star button (toggle-able any time, independent of memo file content) ----------
  function starIconSvg(filled) {
    return filled
      ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4"><path d="M12 2.5l2.9 6.26 6.85.86-5.05 4.77 1.36 6.86L12 17.9l-6.06 3.35 1.36-6.86L2.25 9.62l6.85-.86L12 2.5z"/></svg>`
      : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2.5l2.9 6.26 6.85.86-5.05 4.77 1.36 6.86L12 17.9l-6.06 3.35 1.36-6.86L2.25 9.62l6.85-.86L12 2.5z"/></svg>`;
  }

  function renderStarBtn(id) {
    const starred = isStarred(id);
    const colorClass = starred ? 'text-warning' : 'text-base-content/25 hover:text-base-content/50';
    return `<button class="reset-btn star-btn ${colorClass} transition-colors p-1" data-star-id="${escapeHtml(id)}" aria-label="スター">${starIconSvg(starred)}</button>`;
  }

  function wireStarButtons(container, onDone) {
    container.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.starId;
        btn.disabled = true;
        try {
          await toggleStar(id);
          onDone();
        } catch (err) {
          if (document.getElementById('listScreen').style.display !== 'none') {
            showStatus('listStatusBar', `スター更新失敗: ${err.message}`, 'err');
          } else {
            showStatus('detailStatusBar', `スター更新失敗: ${err.message}`, 'err');
          }
          btn.disabled = false;
        }
      });
    });
  }

  // ---------- config ----------
  function loadConfig() {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveConfig(c) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(c));
  }

  // ---------- local memo cache (keyed by repo, keyed by file path -> {sha, ...memo}) ----------
  function cacheKey() {
    return `memoapp_cache::${config.owner}::${config.repo}`;
  }
  function loadCache() {
    try {
      const raw = localStorage.getItem(cacheKey());
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveCache(cache) {
    try { localStorage.setItem(cacheKey(), JSON.stringify(cache)); } catch (e) { /* storage full: ignore, cache is best-effort */ }
  }
  function putCacheEntry(path, sha, memo) {
    const cache = loadCache();
    cache[path] = { sha, id: memo.id, thread_id: memo.thread_id, parent_id: memo.parent_id, created_at: memo.created_at, location: memo.location, body: memo.body, attachments: memo.attachments || [], title: memo.title || null, tags: memo.tags || [], link_preview: memo.link_preview || null };
    saveCache(cache);
  }

  // ---------- GitHub API ----------
  function ghHeaders() {
    return {
      'Authorization': `Bearer ${config.pat}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  async function ghFetch(url, opts = {}) {
    const res = await fetch(url, { ...opts, headers: { ...ghHeaders(), ...(opts.headers || {}) } });
    if (!res.ok) {
      let msg = `${res.status} ${res.statusText}`;
      try {
        const body = await res.json();
        if (body && body.message) msg += ` — ${body.message}`;
      } catch (e) {}
      throw new Error(msg);
    }
    return res.json();
  }

  async function getDefaultBranch() {
    const info = await ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}`);
    return info.default_branch;
  }

  async function fetchTree(branch) {
    const data = await ghFetch(
      `https://api.github.com/repos/${config.owner}/${config.repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`
    );
    return (data.tree || []).filter(
      item => item.type === 'blob' && item.path.startsWith(MEMO_DIR + '/') && item.path.endsWith('.md')
    );
  }

  async function fetchBlob(item) {
    const data = await ghFetch(item.url);
    return base64ToUtf8(data.content.replace(/\n/g, ''));
  }

  async function commitMemo(path, content, message) {
    return ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({
        message,
        content: utf8ToBase64(content),
        branch: config.branch
      })
    });
  }

  // ---------- file attachments (PDF / md / images) ----------
  const ATTACHMENT_DIR = 'attachments';
  const MAX_ATTACHMENT_BYTES = 5 * 1024 * 1024; // 5MB — the simple Contents API PUT isn't reliable much beyond this

  function sanitizeFilename(name) {
    return name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 100) || 'file';
  }

  function guessMimeType(name) {
    const ext = (name.split('.').pop() || '').toLowerCase();
    const map = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', pdf: 'application/pdf', md: 'text/markdown' };
    return map[ext] || 'application/octet-stream';
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result; // "data:<mime>;base64,XXXX"
        resolve(result.slice(result.indexOf(',') + 1));
      };
      reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
      reader.readAsDataURL(file);
    });
  }

  async function commitFileBase64(path, base64Content, message) {
    return ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({ message, content: base64Content, branch: config.branch })
    });
  }

  // Uploads each file to attachments/<memoId>/<sanitized name> and returns [{name, path}, ...]
  async function uploadAttachments(memoId, files) {
    const results = [];
    for (const file of files) {
      const base64 = await readFileAsBase64(file);
      const safeName = sanitizeFilename(file.name);
      const path = `${ATTACHMENT_DIR}/${memoId}/${safeName}`;
      await commitFileBase64(path, base64, `attachment: ${safeName}`);
      results.push({ name: file.name, path });
    }
    return results;
  }

  function parseAttachmentsString(raw) {
    if (!raw) return [];
    return raw.split(';;').filter(Boolean).map(pair => {
      const [name, path] = pair.split('::');
      return { name: name || path, path };
    });
  }

  function encodeAttachmentsString(attachments) {
    return attachments.map(a => `${a.name}::${a.path}`).join(';;');
  }

  // ---------- epistemic tags (fact / inference / question / idea) — fixed, tiny vocabulary,
  //            deliberately not open-ended categories, so there's nothing to "think up".
  //            Mutually exclusive: 0 or 1 selected. No tag selected implicitly means "feeling". ----------
  const TAG_DEFS = [
    { key: 'fact', label: '事実' },
    { key: 'analysis', label: '分析' },
    { key: 'question', label: '疑問' },
    { key: 'idea', label: 'アイデア' }
  ];
  const TAG_LABELS = Object.fromEntries(TAG_DEFS.map(t => [t.key, t.label]));
  const TAG_BADGE_CLASS = { fact: 'badge-info', analysis: 'badge-warning' };
  function tagBadgeClass(key) {
    return TAG_BADGE_CLASS[key] || 'badge-neutral';
  }

  const selectedTag = { new: null, reply: null };

  function renderTagPicker(context) {
    const container = document.getElementById(context === 'new' ? 'newMemoTagPicker' : 'replyTagPicker');
    const chips = TAG_DEFS.map(t => {
      const active = selectedTag[context] === t.key;
      const cls = active ? tagBadgeClass(t.key) : 'badge-outline text-base-content/50';
      return `<button type="button" class="tag-toggle badge ${cls} font-mono text-xs" data-context="${context}" data-tag="${t.key}">${t.label}</button>`;
    }).join('');
    container.innerHTML = `${chips}<span class="text-[10px] font-mono text-base-content/30 self-center ml-1">未選択 = 気持ち</span>`;
    container.querySelectorAll('.tag-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const ctx = btn.dataset.context;
        selectedTag[ctx] = (selectedTag[ctx] === btn.dataset.tag) ? null : btn.dataset.tag;
        renderTagPicker(ctx);
        if (ctx === 'new') saveNewDraft(); else saveReplyDraft();
      });
    });
  }

  function renderTagBadge(tags) {
    const arr = Array.isArray(tags) ? tags : (typeof tags === 'string' ? tags.split(',').map(s => s.trim()).filter(Boolean) : []);
    if (!arr.length) return '';
    const key = arr[0];
    return `<span class="badge ${tagBadgeClass(key)} badge-xs font-mono">${escapeHtml(TAG_LABELS[key] || key)}</span>`;
  }

  // ---------- draft auto-save (localStorage) — so in-progress text survives an accidental
  //            reload/close. Attachments aren't saved here (File objects can't survive a reload). ----------
  function debounce(fn, delay) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }

  function saveNewDraft() {
    const title = document.getElementById('newMemoTitleInput').value;
    const body = document.getElementById('newMemoInput').value;
    const tag = selectedTag.new;
    if (!title && !body && !tag) {
      localStorage.removeItem('memoapp_draft_new');
      return;
    }
    localStorage.setItem('memoapp_draft_new', JSON.stringify({ title, body, tag }));
  }

  function restoreNewDraft() {
    try {
      const raw = localStorage.getItem('memoapp_draft_new');
      if (!raw) return;
      const draft = JSON.parse(raw);
      document.getElementById('newMemoTitleInput').value = draft.title || '';
      document.getElementById('newMemoInput').value = draft.body || '';
      selectedTag.new = draft.tag || null;
      renderTagPicker('new');
    } catch (e) { /* corrupt draft: ignore */ }
  }

  function clearNewDraft() {
    localStorage.removeItem('memoapp_draft_new');
  }

  function replyDraftKey(tid) {
    return `memoapp_draft_reply::${tid}`;
  }

  function saveReplyDraft() {
    if (!currentThreadId) return;
    const body = document.getElementById('replyInput').value;
    const tag = selectedTag.reply;
    if (!body && !tag) {
      localStorage.removeItem(replyDraftKey(currentThreadId));
      return;
    }
    localStorage.setItem(replyDraftKey(currentThreadId), JSON.stringify({ body, tag }));
  }

  function restoreReplyDraft(tid) {
    selectedTag.reply = null;
    try {
      const raw = localStorage.getItem(replyDraftKey(tid));
      if (raw) {
        const draft = JSON.parse(raw);
        document.getElementById('replyInput').value = draft.body || '';
        selectedTag.reply = draft.tag || null;
      } else {
        document.getElementById('replyInput').value = '';
      }
    } catch (e) {
      document.getElementById('replyInput').value = '';
    }
    renderTagPicker('reply');

  function clearReplyDraft(tid) {
    localStorage.removeItem(replyDraftKey(tid));
  }

  const saveNewDraftDebounced = debounce(saveNewDraft, 400);
  const saveReplyDraftDebounced = debounce(saveReplyDraft, 400);

  // ---------- pending (not-yet-uploaded) attachments per compose box ----------
  const pendingFiles = { new: [], reply: [] };

  function renderAttachmentChips(context) {
    const container = document.getElementById(context === 'new' ? 'newMemoAttachments' : 'replyAttachments');
    container.innerHTML = pendingFiles[context].map((f, i) => `

  function handleFileInputChange(context, fileList) {
    const statusEl = context === 'new' ? 'listStatusBar' : 'detailStatusBar';
    for (const file of Array.from(fileList)) {
      if (file.size > MAX_ATTACHMENT_BYTES) {
        showStatus(statusEl, `"${file.name}" は5MBを超えるため添付できません`, 'err');
        continue;
      }
      pendingFiles[context].push(file);

  // Fetches an attachment via the authenticated API, then opens it as a blob URL (works for private repos,
  // unlike a plain raw.githubusercontent.com link). Opens the tab synchronously to dodge popup blockers.
  async function openAttachment(path, name) {
    const statusEl = document.getElementById('detailScreen').style.display !== 'none' ? 'detailStatusBar' : 'listStatusBar';
    const win = window.open('', '_blank');
    try {
      const data = await ghFetch(
        `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}?ref=${encodeURIComponent(config.branch)}`
      );
      const base64 = data.content.replace(/\n/g, '');
      const byteChars = atob(base64);
      const byteArray = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteArray[i] = byteChars.charCodeAt(i);
      const blob = new Blob([byteArray], { type: guessMimeType(name) });
      const url = URL.createObjectURL(blob);
      if (win) win.location.href = url; else window.open(url, '_blank');
    } catch (e) {
      if (win) win.close();
      showStatus(statusEl, `添付の取得に失敗: ${e.message}`, 'err');
    }
  }

  function wireAttachmentChips(container) {
    container.querySelectorAll('.attachment-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openAttachment(btn.dataset.path, btn.dataset.name);
      });
    });
  }

  // ---------- AI kick (framework only, for now): create a plain GitHub Issue with the thread's
  //            content and no @-mention. Automatic triggering is on hold; the intended workflow is
  //            to periodically open Claude Code or Codex yourself and work through the open issues.
  //            Revisit AI_MENTION-based auto-triggering later if/when that becomes worth it. ----------
  function buildAiIssueTitle(thread, userText) {
    const base = userText ? userText.slice(0, 60) : firstLine(thread.entries[0].body).slice(0, 40);
    return `[${thread.tid}] ${base}`;
  }

  function buildAiIssueBody(thread, userText) {
    const entriesText = thread.entries.map(m =>
      `- [${m.created_at}] (memo id: ${m.id})\n  ${m.body.replace(/\n/g, '\n  ')}`
    ).join('\n\n');
    const instruction = userText || 'このメモを確認し、有用そうであれば整理・企画書化・簡単な試作など、適切だと思う形で対応してください。';
    return `${instruction}\n\n---\n\n以下がメモの内容です(スレッドID: ${thread.tid})。\n\n${entriesText}\n\n(各メモファイルは \`${MEMO_DIR}/\` 配下に \`<memo id>.md\` という名前で保存されています。必要であればリポジトリ内を検索してください。)`;
  }

  async function createAiIssue() {
    const thread = getThread(currentThreadId);
    if (!thread) throw new Error('スレッドが見つかりません');
    const userText = document.getElementById('replyInput').value.trim();
    return ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}/issues`, {
      method: 'POST',
      body: JSON.stringify({
        title: buildAiIssueTitle(thread, userText),
        body: buildAiIssueBody(thread, userText)
      })
    });
  }

  function showAiStatus(message, kind, linkUrl) {
    const el = document.getElementById('detailStatusBar');
    el.classList.remove('hidden');
    const colorClass = kind === 'err' ? 'text-error' : kind === 'ok' ? 'text-success' : 'text-base-content/50';
    el.className = `text-xs font-mono mt-1 ${colorClass}`;

    } else {
      el.textContent = message;

  }

  // ---------- stars.json (single mutable index file; memo files themselves stay write-once) ----------
  function sortObjectKeys(obj) {
    const out = {};
    Object.keys(obj).sort().forEach(k => { out[k] = obj[k]; });
    return out;
  }

  async function loadStars() {
    try {
      const data = await ghFetch(
        `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${STARS_PATH}?ref=${encodeURIComponent(config.branch)}`
      );
      const text = base64ToUtf8(data.content.replace(/\n/g, ''));
      starsState = { sha: data.sha, stars: JSON.parse(text) };
    } catch (e) {
      if (e.message.startsWith('404')) {
        starsState = { sha: null, stars: {} }; // file doesn't exist yet; created on first star
      } else {
        throw e;
      }
    }
  }

  function isStarred(id) {
    return !!starsState.stars[id];
  }

  async function writeStars(updatedStars) {
    const content = JSON.stringify(sortObjectKeys(updatedStars), null, 2) + '\n';
    const body = {
      message: 'update stars',
      content: utf8ToBase64(content),
      branch: config.branch
    };
    if (starsState.sha) body.sha = starsState.sha;
    const res = await ghFetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${STARS_PATH}`, {
      method: 'PUT',
      body: JSON.stringify(body)
    });
    starsState = { sha: res.content.sha, stars: updatedStars };
  }

  async function toggleStar(id) {
    const updated = { ...starsState.stars };
    if (updated[id]) delete updated[id]; else updated[id] = true;
    try {
      await writeStars(updated);
    } catch (e) {
      // sha mismatch (another write landed first) — refresh once and retry the same toggle
      if (e.message.startsWith('409') || e.message.toLowerCase().includes('does not match')) {
        await loadStars();
        const retried = { ...starsState.stars };
        if (retried[id]) delete retried[id]; else retried[id] = true;
        await writeStars(retried);
      } else {
        throw e;
      }
    }
  }

  // ---------- frontmatter ----------
  function parseFrontmatter(text) {
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if (!m) return { meta: {}, body: text.trim() };
    const [, fm, body] = m;
    const meta = {};
    const lines = fm.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^\s/.test(line)) continue; // nested lines are consumed by the lookahead below
      const km = line.match(/^([a-zA-Z_]+):\s*(.*)$/);
      if (!km) continue;
      const key = km[1];
      let val = km[2].trim();
      if (val === '') {
        // possible nested block (any key, e.g. location:, link_preview:)
        const nested = {};
        let j = i + 1;
        while (j < lines.length && /^\s+/.test(lines[j])) {
          const lm = lines[j].match(/^\s+([a-zA-Z_]+):\s*(.*)$/);
          if (lm) nested[lm[1]] = lm[2].trim();
          j++;
        }
        if (Object.keys(nested).length) {
          meta[key] = nested;
          continue;
        }
      }
      if (val === 'null' || val === '') val = null;
      meta[key] = val;
    }
    return { meta, body: body.trim() };
  }

  function buildMarkdown(memo) {
    let fm = '---\n';
    fm += `id: ${memo.id}\n`;
    fm += `thread_id: ${memo.thread_id}\n`;
    fm += `parent_id: ${memo.parent_id ?? 'null'}\n`;
    fm += `created_at: ${memo.created_at}\n`;
    if (memo.title) fm += `title: ${memo.title}\n`;
    if (memo.location) {
      fm += `location:\n  lat: ${memo.location.lat}\n  lng: ${memo.location.lng}\n`;
      if (memo.location.address) fm += `  address: ${memo.location.address}\n`;
    }
    if (memo.attachments && memo.attachments.length) {
      fm += `attachments: ${encodeAttachmentsString(memo.attachments)}\n`;
    }
    if (memo.tags && memo.tags.length) {
      fm += `tags: ${memo.tags.join(',')}\n`;
    }
    if (memo.link_preview) {
      fm += `link_preview:\n  url: ${memo.link_preview.url}\n`;
      if (memo.link_preview.title) fm += `  title: ${memo.link_preview.title}\n`;
      if (memo.link_preview.description) fm += `  description: ${memo.link_preview.description}\n`;
      if (memo.link_preview.image) fm += `  image: ${memo.link_preview.image}\n`;
    }
    fm += `status: unprocessed\n`;
    fm += '---\n\n';
    return fm + memo.body + '\n';
  }

  // ---------- link preview (Teams/Slack-style unfurling), fetched once at capture time ----------
  function extractFirstUrl(text) {
    const match = text.match(/https?:\/\/[^\s<>"')\]]+/);
    return match ? match[0] : null;
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((resolve) => setTimeout(() => resolve(null), ms))
    ]);
  }

  function isYouTubeUrl(url) {
    return /(?:youtube\.com\/watch|youtu\.be\/)/i.test(url);
  }

  async function fetchYouTubeOEmbed(url) {
    try {
      const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
      if (!res.ok) {
        console.warn('[link preview] YouTube oEmbed HTTP error', res.status);
        return null;
      }
      const d = await res.json();
      return {
        url,
        title: (d.title || '').trim().slice(0, 200),
        description: d.author_name ? `by ${d.author_name}` : '',
        image: d.thumbnail_url || ''
      };
    } catch (e) {
      console.warn('[link preview] YouTube oEmbed fetch threw', e);
      return null;
    }
  }

  async function fetchLinkPreview(url) {
    if (isYouTubeUrl(url)) {
      const yt = await fetchYouTubeOEmbed(url);
      if (yt) return yt;
      // fall through to microlink below as a last resort (likely also blocked, but worth trying)
    }
    try {
      const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
      if (!res.ok) {
        console.warn('[link preview] HTTP error', res.status, await res.text().catch(() => ''));
        return null;
      }
      const json = await res.json();
      if (json.status !== 'success' || !json.data) {
        console.warn('[link preview] unexpected response', json);
        return null;
      }
      const d = json.data;
      const clean = (s) => (s || '').replace(/\r?\n/g, ' ').trim().slice(0, 200);
      const preview = {
        url,
        title: clean(d.title),
        description: clean(d.description),
        image: (d.image && d.image.url) || ''
      };
      if (!preview.title && !preview.description && !preview.image) {
        console.warn('[link preview] response had no usable fields', d);
        return null;
      }
      return preview;
    } catch (e) {
      console.warn('[link preview] fetch threw', e);
      return null; // best-effort only; the memo still saves fine without a preview
    }
  }

  // ---------- geolocation (best-effort, silent) ----------
  function shortenAddress(displayName) {
    if (!displayName) return null;
    return displayName.split(',').map(s => s.trim()).slice(0, 3).join(', ');
  }

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=0`);
      if (!res.ok) return null;
      const data = await res.json();
      return shortenAddress(data.display_name);
    } catch (e) {
      return null; // best-effort only; fall back to raw coordinates elsewhere
    }
  }

  function requestLocation() {
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const lat = pos.coords.latitude.toFixed(4);
        const lng = pos.coords.longitude.toFixed(4);
        currentLocation = { lat, lng };
        const hint = document.getElementById('locationHint');
        if (hint) hint.textContent = `位置情報を取得済み (${lat}, ${lng})`;
        const address = await reverseGeocode(lat, lng);
        if (address) {
          currentLocation.address = address;
          if (hint) hint.textContent = `位置情報を取得済み: ${address}`;
        }
      },
      () => { /* silently ignore denial/failure */ },
      { timeout: 5000 }
    );
  }

  // ---------- status bars ----------
  function showStatus(elId, msg, kind) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.textContent = msg;
    const colorClass = kind === 'err' ? 'text-error' : kind === 'ok' ? 'text-success' : 'text-base-content/50';
    el.className = `text-xs font-mono mt-1 ${colorClass}`;
    if (kind === 'ok') {
      setTimeout(() => { el.classList.add('hidden'); }, 2500);
    }
  }

  // ---------- thread grouping ----------
  function buildThreads() {
    const threadMap = new Map(); // thread_id -> [memos]
    for (const m of memos) {
      const tid = m.thread_id || m.id;
      if (!threadMap.has(tid)) threadMap.set(tid, []);
      threadMap.get(tid).push(m);
    }
    const threads = [];
    for (const [tid, list] of threadMap) {
      list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const latest = list[list.length - 1].created_at;
      threads.push({ tid, entries: list, latest });
    }
    threads.sort((a, b) => new Date(b.latest) - new Date(a.latest));
    return threads;
  }

  function getThread(tid) {
    return buildThreads().find(t => t.tid === tid);
  }

  function threadTitleText(thread) {
    return thread.entries[0].title || '';
  }

  // ---------- render: list screen ----------
  // ---------- shared layout: metadata row (time -> address -> right-aligned extras), then full-width body ----------
  function renderLinkPreviewCard(lp) {
    if (!lp || !lp.url) return '';
    const img = lp.image
      ? `<img src="${escapeHtml(lp.image)}" class="w-16 h-16 object-cover flex-shrink-0" loading="lazy" alt="">`
      : '';
    return `
      <a href="${escapeHtml(lp.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"
         class="flex gap-2 mt-1 border border-base-300 hover:bg-base-200/60 transition-colors overflow-hidden no-underline">
        ${img}
        <div class="min-w-0 py-1.5 pr-2 flex flex-col justify-center gap-0.5">
          ${lp.title ? `<div class="text-xs font-semibold text-base-content truncate">${escapeHtml(lp.title)}</div>` : ''}
          ${lp.description ? `<div class="text-[11px] text-base-content/50 line-clamp-2">${escapeHtml(lp.description)}</div>` : ''}
          <div class="text-[10px] text-base-content/30 truncate">${escapeHtml(lp.url)}</div>
        </div>
      </a>`;
  }

  function renderMemoBlock(m, { clamp = false, extraRight = '' } = {}) {
    const locText = m.location ? (m.location.address || `${m.location.lat}, ${m.location.lng}`) : '';
    const attachmentsHtml = (m.attachments && m.attachments.length)
      ? `<div class="flex flex-wrap gap-1 mt-1">${m.attachments.map(a => {
          const isImage = /\.(png|jpe?g|gif|webp)$/i.test(a.name);
          return `<button type="button" class="reset-btn attachment-chip badge badge-outline gap-1 font-mono text-[10px] cursor-pointer" data-path="${escapeHtml(a.path)}" data-name="${escapeHtml(a.name)}">${isImage ? '🖼' : '📄'} ${escapeHtml(a.name)}</button>`;
        }).join('')}</div>`
      : '';
    return `
      <div class="flex items-center gap-2 text-[11px] font-mono text-base-content/40 w-full mb-1">
        <span class="flex-shrink-0">${relativeTime(m.created_at)}</span>
        ${locText ? `<span class="truncate min-w-0">${escapeHtml(locText)}</span>` : ''}
        <span class="flex-1"></span>
        <span class="flex items-center gap-1 flex-shrink-0">${renderTagBadge(m.tags)}${extraRight}</span>
      </div>
      <p class="text-sm leading-relaxed whitespace-pre-wrap break-words w-full ${clamp ? 'line-clamp-3' : ''}">${escapeHtml(m.body)}</p>
      ${renderLinkPreviewCard(m.link_preview)}
      ${attachmentsHtml}`;
  }

  function scrollListToBottom() {
    const el = document.getElementById('threadList');
    el.scrollTop = el.scrollHeight;
  }

  function renderThreadList() {
    const container = document.getElementById('threadList');
    if (memos.length === 0) {
      container.innerHTML = '<div class="text-center py-16 text-sm font-mono text-base-content/40 leading-loose">まだメモがありません。<br>上の欄に書いて「記録する」を押してください。</div>';
      return;
    }
    // Flat, thread-agnostic chronological order (oldest first, newest at the bottom). A pinned
    // title row (daisyUI "table with pinned rows") is only emitted when the thread_id changes
    // from the immediately preceding row — consecutive rows from the same thread share one pin-row.
    // In 'latest' mode, only each thread's most recent entry is shown as a row (so every row gets
    // its own pin-row, since no two consecutive rows can share a thread_id).
    const threadByTid = new Map(buildThreads().map(t => [t.tid, t]));
    const rows = listMode === 'latest'
      ? Array.from(threadByTid.values()).map(t => t.entries[t.entries.length - 1])
      : [...memos];
    const sorted = rows.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    let html = '';
    let prevTid = null;
    let tbodyOpen = false;

    for (const m of sorted) {
      const tid = m.thread_id || m.id;
      if (tid !== prevTid) {
        if (tbodyOpen) html += '</tbody>';
        const thread = threadByTid.get(tid);
        const titleText = thread ? threadTitleText(thread) : '';
        const countBadge = thread && thread.entries.length > 1
          ? `<span class="badge badge-primary badge-sm font-mono ml-2 flex-shrink-0">${thread.entries.length}件</span>`
          : '';
        html += `
          <thead>
            <tr>
              <th class="bg-base-200 px-1 py-2 text-xs font-mono font-semibold normal-case text-base-content">
                <div class="flex items-center">
                  <span class="truncate min-w-0">${escapeHtml(titleText)}</span>
                  ${countBadge}
                </div>
              </th>
            </tr>
          </thead>
          <tbody>`;
        tbodyOpen = true;
        prevTid = tid;
      }
      html += `
        <tr class="thread-row hover:bg-base-200/60 transition-colors cursor-pointer align-top" data-tid="${escapeHtml(tid)}" role="button" tabindex="0">
          <td class="px-1 py-3">
            ${renderMemoBlock(m, { clamp: true, extraRight: renderStarBtn(m.id) })}
          </td>
        </tr>`;
    }
    if (tbodyOpen) html += '</tbody>';

    container.innerHTML = `<table class="table table-pin-rows table-fixed w-full">${html}</table>`;

    container.querySelectorAll('.thread-row').forEach(row => {
      row.addEventListener('click', () => openThread(row.dataset.tid));
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openThread(row.dataset.tid);
        }
      });
    });
    wireStarButtons(container, renderThreadList);
    wireAttachmentChips(container);
  }

  // ---------- render: detail screen ----------
  function renderDetail() {
    const thread = getThread(currentThreadId);
    if (!thread) { showList(); return; }

  // ---------- load from GitHub (tree-diff cached) ----------
  async function loadMemos() {
    showStatus('listStatusBar', '読み込み中…', 'ok');
    document.getElementById('listStatusBar').classList.remove('hidden');
    try {
      const branch = config.branch || await getDefaultBranch();
      config.branch = branch;
      saveConfig(config);

      const [items] = await Promise.all([
        fetchTree(branch),
        loadStars()
      ]);
      const cache = loadCache();
      let fetchedCount = 0;

      const results = await Promise.all(items.map(async item => {
        const cached = cache[item.path];
        if (cached && cached.sha === item.sha) {
          return cached;
        }
        const text = await fetchBlob(item);
        const { meta, body } = parseFrontmatter(text);
        if (meta.attachments) meta.attachments = parseAttachmentsString(meta.attachments);
        if (meta.tags) meta.tags = meta.tags.split(',').map(s => s.trim()).filter(Boolean);
        const entry = { sha: item.sha, ...meta, body };
        cache[item.path] = entry;
        fetchedCount++;
        return entry;
      }));

      saveCache(cache);
      memos = results.filter(m => m.id && m.created_at);
      renderThreadList();
      scrollListToBottom();
      showStatus('listStatusBar', `更新完了(新規取得 ${fetchedCount} 件 / 全 ${memos.length} 件)`, 'ok');
    } catch (e) {
      showStatus('listStatusBar', `読み込み失敗: ${e.message}`, 'err');
    }
  }

  // ---------- submit: new memo (from list screen) ----------
  async function submitNewMemo() {
    const textarea = document.getElementById('newMemoInput');
    const body = textarea.value.trim();
    const titleInput = document.getElementById('newMemoTitleInput');
    const title = titleInput.value.trim();
    const files = pendingFiles.new;
    if (!body && files.length === 0) return;

    const now = new Date();
    const id = makeId(now);
    const memo = {
      id,
      thread_id: id,
      parent_id: null,
      created_at: localISOString(now),
      location: currentLocation,
      body: body || '(添付ファイルのみ)'
    };
    if (title) memo.title = title;
    if (selectedTag.new) memo.tags = [selectedTag.new];

    const btn = document.getElementById('newMemoBtn');
    btn.disabled = true;
    document.getElementById('listStatusBar').classList.remove('hidden');
    try {
      if (files.length) {
        showStatus('listStatusBar', 'ファイルをアップロード中…', 'ok');
        document.getElementById('listStatusBar').classList.remove('hidden');
        memo.attachments = await uploadAttachments(id, files);
      }
      const url = extractFirstUrl(body);
      let linkPreviewFailed = false;
      if (url) {
        showStatus('listStatusBar', 'リンク情報を取得中…', 'ok');
        document.getElementById('listStatusBar').classList.remove('hidden');
        const preview = await withTimeout(fetchLinkPreview(url), 15000);
        if (preview) memo.link_preview = preview; else linkPreviewFailed = true;
      }
      showStatus('listStatusBar', '記録中…', 'ok');
      document.getElementById('listStatusBar').classList.remove('hidden');
      await commitOne(memo);
      textarea.value = '';
      titleInput.value = '';
      pendingFiles.new = [];
      renderAttachmentChips('new');
      selectedTag.new = null;
      renderTagPicker('new');
      clearNewDraft();
      showStatus('listStatusBar', linkPreviewFailed ? '記録しました(リンクプレビューは取得できませんでした)' : '記録しました', 'ok');
      renderThreadList();
      scrollListToBottom();
    } catch (e) {
      showStatus('listStatusBar', `記録失敗: ${e.message}`, 'err');
    } finally {
      btn.disabled = false;
      textarea.focus();
    }
  }

  // ---------- submit: reply (from detail screen) ----------
  async function submitReply() {
    if (!currentThreadId) return;
    const textarea = document.getElementById('replyInput');
    const body = textarea.value.trim();
    const files = pendingFiles.reply;
    if (!body && files.length === 0) return;

    const thread = getThread(currentThreadId);
    const lastEntry = thread.entries[thread.entries.length - 1];

    const now = new Date();
    const id = makeId(now);
    const memo = {
      id,
      thread_id: currentThreadId,
      parent_id: lastEntry.id,
      created_at: localISOString(now),
      location: currentLocation,
      body: body || '(添付ファイルのみ)'
    };
    if (selectedTag.reply) memo.tags = [selectedTag.reply];

    const btn = document.getElementById('replyBtn');
    btn.disabled = true;
    document.getElementById('detailStatusBar').classList.remove('hidden');
    try {
      if (files.length) {
        showStatus('detailStatusBar', 'ファイルをアップロード中…', 'ok');
        document.getElementById('detailStatusBar').classList.remove('hidden');
        memo.attachments = await uploadAttachments(id, files);
      }
      const url = extractFirstUrl(body);
      let linkPreviewFailed = false;
      if (url) {
        showStatus('detailStatusBar', 'リンク情報を取得中…', 'ok');
        document.getElementById('detailStatusBar').classList.remove('hidden');
        const preview = await withTimeout(fetchLinkPreview(url), 15000);
        if (preview) memo.link_preview = preview; else linkPreviewFailed = true;
      }
      showStatus('detailStatusBar', '記録中…', 'ok');
      document.getElementById('detailStatusBar').classList.remove('hidden');
      await commitOne(memo);
      textarea.value = '';
      pendingFiles.reply = [];
      renderAttachmentChips('reply');
      selectedTag.reply = null;
      renderTagPicker('reply');
      clearReplyDraft(currentThreadId);
      showStatus('detailStatusBar', linkPreviewFailed ? '記録しました(リンクプレビューは取得できませんでした)' : '記録しました', 'ok');
      renderDetail();
      document.getElementById('detailEntries').scrollTop = document.getElementById('detailEntries').scrollHeight;
    } catch (e) {
      showStatus('detailStatusBar', `記録失敗: ${e.message}`, 'err');
    } finally {
      btn.disabled = false;
      textarea.focus();
    }
  }

  async function commitOne(memo) {
    const created = new Date(memo.created_at);
    const p = nowParts(created);
    const path = `${MEMO_DIR}/${p.yyyy}/${p.mm}/${p.dd}/${memo.id}.md`;
    const content = buildMarkdown(memo);
    const res = await commitMemo(path, content, `memo: ${memo.body.slice(0, 40).replace(/\n/g, ' ')}`);
    memos.push(memo);
    const sha = res && res.content && res.content.sha;
    if (sha) putCacheEntry(path, sha, memo);
  }

  // ---------- settings screen ----------
  function showSettings(isInitial) {
    document.getElementById('listScreen').style.display = 'none';
    document.getElementById('detailScreen').style.display = 'none';
    document.getElementById('settingsScreen').style.display = 'block';
    document.getElementById('cancelSettings').style.display = isInitial ? 'none' : 'inline-flex';
    setNavList();
    if (config) {
      document.getElementById('inputOwner').value = config.owner || '';
      document.getElementById('inputRepo').value = config.repo || '';
      document.getElementById('inputPat').value = config.pat || '';
    }
  }

  async function handleSaveSettings() {
    const owner = document.getElementById('inputOwner').value.trim();
    const repo = document.getElementById('inputRepo').value.trim();
    const pat = document.getElementById('inputPat').value.trim();
    const statusEl = document.getElementById('settingsStatus');
    if (!owner || !repo || !pat) {
      statusEl.textContent = 'すべて入力してください。';
      statusEl.style.display = 'block';
      statusEl.className = 'text-xs font-mono mt-3 text-error';
      return;
    }
    statusEl.textContent = '接続確認中…';
    statusEl.style.display = 'block';
    statusEl.className = 'text-xs font-mono mt-3 text-base-content/50';

    const testConfig = { owner, repo, pat, branch: null };
    config = testConfig;
    try {
      config.branch = await getDefaultBranch();
      saveConfig(config);
      showList();
      requestLocation();
      loadMemos();
    } catch (e) {
      statusEl.textContent = `接続失敗: ${e.message}`;
      statusEl.className = 'text-xs font-mono mt-3 text-error';
    }
  }

  // ---------- init ----------
  function init() {
    config = loadConfig();

    renderTagPicker('new');
    renderTagPicker('reply');

    const latestOnlyToggle = document.getElementById('latestOnlyToggle');
    latestOnlyToggle.checked = listMode === 'latest';
    latestOnlyToggle.addEventListener('change', () => {
      listMode = latestOnlyToggle.checked ? 'latest' : 'all';
      localStorage.setItem('memoapp_listmode', listMode);
      renderThreadList();
      scrollListToBottom();
    });

    document.getElementById('openSettings').addEventListener('click', () => {
      document.getElementById('mainDrawer').checked = false;
      showSettings(false);
    });
    document.getElementById('cancelSettings').addEventListener('click', showList);
    document.getElementById('saveSettings').addEventListener('click', handleSaveSettings);

    document.getElementById('newMemoBtn').addEventListener('click', submitNewMemo);
    document.getElementById('newMemoTitleInput').addEventListener('input', saveNewDraftDebounced);
    document.getElementById('newMemoTitleInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('newMemoInput').focus();
      }
    });
    document.getElementById('newMemoInput').addEventListener('input', saveNewDraftDebounced);
    document.getElementById('newMemoInput').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitNewMemo();
    });
    document.getElementById('newMemoAttachBtn').addEventListener('click', () => {
      document.getElementById('newMemoFileInput').click();
    });
    document.getElementById('newMemoFileInput').addEventListener('change', (e) => {
      handleFileInputChange('new', e.target.files);
      e.target.value = '';
    });

    document.getElementById('replyBtn').addEventListener('click', submitReply);
    document.getElementById('replyInput').addEventListener('input', saveReplyDraftDebounced);
    document.getElementById('replyInput').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitReply();
    });
    document.getElementById('replyAttachBtn').addEventListener('click', () => {
      document.getElementById('replyFileInput').click();
    });
    document.getElementById('replyFileInput').addEventListener('change', (e) => {
      handleFileInputChange('reply', e.target.files);
      e.target.value = '';
    });
    document.getElementById('replyInput').addEventListener('focus', () => {
      // give the keyboard a moment to open / dvh to settle, then reveal the latest entry
      setTimeout(() => {
        const container = document.getElementById('detailEntries');
        container.scrollTop = container.scrollHeight;
      }, 150);
    });

    document.getElementById('aiRequestBtn').addEventListener('click', async () => {
      const btn = document.getElementById('aiRequestBtn');
      showAiStatus('AIへ依頼を送信中…', 'ok');
      btn.disabled = true;
      try {
        const res = await createAiIssue();
        document.getElementById('replyInput').value = '';
        clearReplyDraft(currentThreadId);
        showAiStatus(`依頼を送信しました(Issue #${res.number})`, 'ok', res.html_url);
      } catch (e) {
        showAiStatus(`送信失敗: ${e.message}`, 'err');
      } finally {
        btn.disabled = false;
      }
    });

    // Safety net: mobile browsers don't reliably fire beforeunload, so save on hide too.
    const saveAllDraftsNow = () => { saveNewDraft(); saveReplyDraft(); };
    window.addEventListener('pagehide', saveAllDraftsNow);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveAllDraftsNow();
    });

    if (!config || !config.owner || !config.repo || !config.pat) {
      showSettings(true);
    } else {
      restoreNewDraft();
      showList();
      requestLocation();
      loadMemos();
    }
  }

  init();
})();
</script>
</body>
</html>
